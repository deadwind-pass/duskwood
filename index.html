<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stock Desk">
<meta name="theme-color" content="#1c1f38">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Stock Desk</title>
<style>
html,body{height:100%}
body{margin:0;font:15px/1.5 -apple-system,system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#e8e9f3;background:linear-gradient(170deg,#2a2f55,#14151f 70%);display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.card{width:100%;max-width:380px;padding:22px;border-radius:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 50px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);box-sizing:border-box}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 14px;color:#aab0c4;font-size:13.5px}
label{display:block;font-size:12.5px;color:#aab0c4;margin:12px 0 5px}
input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:#fff;padding:11px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);outline:none;transition:border-color .15s}
input:focus{border-color:#5b9bff}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;transition:opacity .15s,transform .1s}button:active{transform:scale(.98)}
.go{width:100%;margin-top:18px;background:#3b82f6;color:#fff}.ghost{background:rgba(255,255,255,.1);color:#e8e9f3}
.row{display:flex;gap:10px;margin-top:16px}.row button{flex:1}
.err{color:#fca5a5;font-size:13.5px;margin-top:12px;min-height:1em;white-space:pre-wrap}
.spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.2);border-top-color:#8ab4ff;border-radius:50%;margin:6px auto 14px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
.c{text-align:center}.note{font-size:12px;color:#8d93a8;margin-top:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="card" id="setup" hidden>
  <h1>Stock Desk</h1>
  <p>第一次使用：輸入 Apps Script 的網址和 KEY。只存在這台裝置，不會上傳到別的地方。</p>
  <label for="u">Apps Script 網址（結尾是 /exec）</label>
  <input id="u" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
  <label for="k">KEY</label>
  <input id="k" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button class="go" id="save" type="button">開始使用</button>
  <div class="err" id="serr"></div>
</div>
<div class="card c" id="load" hidden>
  <div class="spin"></div>
  <div>載入 Stock Desk…</div>
  <div class="note" id="lnote"></div>
</div>
<div class="card" id="fail" hidden>
  <h1>載入失敗</h1>
  <div class="err" id="ferr" style="margin-top:0"></div>
  <div class="row"><button class="go" id="retry" type="button" style="margin-top:0">再試一次</button><button class="ghost" id="reset" type="button">重新設定</button></div>
</div>
<script>
/* Stock Desk 載入頁 v2(秒開)
   這一頁本身沒有任何資料。它用存在這台裝置的網址和 KEY,向你的 Apps Script 要 App(?fn=apphtml),拿到後整頁換成 App。
   v2:App 會在這台裝置存一份(瀏覽器的 IndexedDB,和網址、KEY 一樣只在這台裝置)。之後每次打開直接用存的那份,不用再等下載;
       開著的時候在背景問 Apps Script「現在是哪一版」(?fn=appver),有新版才下載,下載好會出現「vX.XX 可用 · 套用」。
       存的那份如果開不起來,下一次打開會自動丟掉重抓。
   要換網址或 KEY:在網址後面加 #reset 再開一次(會連存的那份一起清掉),或在「載入失敗」畫面按「重新設定」。 */
(function(){
  var K='sdl.cfg',BK='sdl.boot',$=function(i){return document.getElementById(i)};
  function get(){try{var c=JSON.parse(localStorage.getItem(K)||'null');return c&&c.url?c:null}catch(e){return null}}
  function show(id){['setup','load','fail'].forEach(function(x){$(x).hidden=x!==id})}
  function setup(msg){var c=get()||{};$('u').value=c.url||'';$('k').value=c.key||'';$('serr').textContent=msg||'';show('setup')}
  function fail(msg){$('ferr').textContent=msg;show('fail')}
  /* ── 存在這台裝置的 App(IndexedDB:sdl › app › cur / next)── */
  function db(){return new Promise(function(ok,no){try{var r=indexedDB.open('sdl',1);r.onupgradeneeded=function(){r.result.createObjectStore('app')};r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}}catch(e){no(e)}})}
  function idb(mode,fn){return db().then(function(d){return new Promise(function(ok,no){var t=d.transaction('app',mode),s=t.objectStore('app'),out;try{out=fn(s)}catch(e){return no(e)}t.oncomplete=function(){d.close();ok(out&&out.result)};t.onerror=t.onabort=function(){d.close();no(t.error)}})})}
  var dbGet=function(k){return idb('readonly',function(s){return s.get(k)})},dbPut=function(k,v){return idb('readwrite',function(s){return s.put(v,k)})},dbDel=function(k){return idb('readwrite',function(s){return s.delete(k)})};
  var api=function(c,fn){return c.url+'?fn='+fn+'&key='+encodeURIComponent(c.key||'')+'&_='+Date.now()};
  function okHtml(h){if(!h||h.charAt(0)==='{'){var j={};try{j=JSON.parse(h)}catch(e){}throw new Error(j.error||'Apps Script 沒有回傳 App')}if(h.indexOf('<')<0)throw new Error('回傳的內容不是 App');return h}
  /* ── 放進 App 裡的小程式:確認有正常開起來、背景檢查新版、顯示「可用 · 套用」 ── */
  function updater(c,ver){return '<script>('+function(C){
    try{setTimeout(function(){try{localStorage.removeItem('sdl.boot')}catch(e){}},1500)}catch(e){}
    function db(){return new Promise(function(ok,no){var r=indexedDB.open('sdl',1);r.onupgradeneeded=function(){r.result.createObjectStore('app')};r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}})}
    function put(k,v){return db().then(function(d){return new Promise(function(ok,no){var t=d.transaction('app','readwrite');t.objectStore('app').put(v,k);t.oncomplete=function(){d.close();ok()};t.onerror=t.onabort=function(){d.close();no(t.error)}})})}
    var u=function(fn){return C.url+'?fn='+fn+'&key='+encodeURIComponent(C.key||'')+'&_='+Date.now()},busy=false,shown=false;
    function vOf(n){var m=/v\d+\.\d+/.exec(n||'');return m?m[0]:'新版'}
    function pill(name){if(shown||!document.body)return;shown=true;var dk=document.documentElement.classList.contains('m-dark')||document.body.classList.contains('dark');
      var d=document.createElement('div');d.id='sdlUp';d.setAttribute('role','status');
      d.style.cssText='position:fixed;z-index:2147483600;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,14px);opacity:0;display:flex;align-items:center;gap:10px;padding:7px 7px 7px 15px;border-radius:99px;font:14px/1.3 -apple-system,system-ui,"Noto Sans TC",sans-serif;white-space:nowrap;-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 10px 28px rgba(0,0,0,.28);transition:opacity .3s,transform .3s cubic-bezier(.2,.9,.3,1);'+(dk?'background:rgba(36,38,54,.82);border:1px solid rgba(255,255,255,.16);color:#eceef3':'background:rgba(255,255,255,.86);border:1px solid rgba(120,130,150,.25);color:#1f2433');
      var t=document.createElement('span');t.innerHTML='<b></b> 可用';t.firstChild.textContent=vOf(name);
      var b=document.createElement('button');b.type='button';b.textContent='套用';b.setAttribute('aria-label','套用新版 '+vOf(name));b.style.cssText='all:unset;cursor:pointer;font:inherit;font-size:13px;font-weight:700;padding:7px 13px;border-radius:99px;background:#3b82f6;color:#fff';
      b.onclick=function(){b.textContent='套用中…';location.reload()};
      d.appendChild(t);d.appendChild(b);document.documentElement.appendChild(d);
      requestAnimationFrame(function(){d.style.opacity='1';d.style.transform='translate(-50%,0)'})}
    function grab(id,name){busy=true;return fetch(u('apphtml'),{redirect:'follow',cache:'no-store',referrerPolicy:'no-referrer'}).then(function(r){return r.text()}).then(function(h){if(!h||h.charAt(0)==='{'||h.indexOf('<')<0)throw 0;return put('next',{html:h,ver:id,name:name||'',at:Date.now()})}).then(function(){busy=false;return true},function(){busy=false;return false})}
    function check(){if(busy||shown||document.hidden)return;
      fetch(u('appver'),{redirect:'follow',cache:'no-store',referrerPolicy:'no-referrer'}).then(function(r){return r.json()}).then(function(j){
        if(j&&j.ok&&j.at){var id=j.name+'|'+j.at;if(id===C.ver)return;grab(id,j.name).then(function(ok){if(ok)pill(j.name)})}
        else if(Date.now()-(C.at||0)>12*36e5)grab('',''); /* Apps Script 還是舊版(沒有 appver):半天更新一次存的那份,下次打開自動換 */
      }).catch(function(){})}
    setTimeout(check,6000);setInterval(check,30*6e4);document.addEventListener('visibilitychange',function(){if(!document.hidden)setTimeout(check,2500)});
  }.toString()+')('+JSON.stringify({url:c.url,key:c.key||'',ver:ver.ver||'',at:ver.at||0}).replace(/</g,'\\u003c')+')<\/script>'}
  function boot(c,rec){try{localStorage.setItem(BK,String(Date.now()))}catch(e){}
    var h=rec.html.replace('__SD_URL__',c.url),up=updater(c,rec),i=h.lastIndexOf('</body>');h=i>0?h.slice(0,i)+up+h.slice(i):h+up;
    document.open();document.write(h);document.close()}
  function fetchApp(c){show('load');$('lnote').textContent='';
    var slow=setTimeout(function(){$('lnote').textContent='第一次要下載整個 App，之後打開就不用等了'},5000);
    var ac=window.AbortController?new AbortController():null,to=setTimeout(function(){if(ac)ac.abort()},90000),opt={redirect:'follow',cache:'no-store',referrerPolicy:'no-referrer',signal:ac?ac.signal:undefined};
    var ver=fetch(api(c,'appver'),opt).then(function(r){return r.json()}).then(function(j){return j&&j.ok&&j.at?{id:j.name+'|'+j.at,name:j.name}:{id:'',name:''}}).catch(function(){return {id:'',name:''}});
    fetch(api(c,'apphtml'),opt).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
      .then(function(h){okHtml(h);return ver.then(function(v){var rec={html:h,ver:v.id,name:v.name,at:Date.now()};clearTimeout(to);clearTimeout(slow);
        return dbPut('cur',rec).catch(function(){}).then(function(){return dbDel('next').catch(function(){})}).then(function(){boot(c,rec)})})})
      .catch(function(e){clearTimeout(to);clearTimeout(slow);var m=String(e&&e.message||e);
        if(/密碼不對|key 不對/.test(m))return setup('KEY 不對，請重新輸入。');
        fail(e&&e.name==='AbortError'?'超過 90 秒沒有回應。請確認網路後再試一次。':/Failed to fetch|Load failed|NetworkError/i.test(m)?'連不到 Apps Script。\n請確認網路，以及網址是不是部署後的 /exec 網址。':m)})}
  function load(fresh){var c=get();if(!c)return setup();
    var bad=false;try{var t=+localStorage.getItem(BK)||0;bad=t>0&&Date.now()-t<10*6e4}catch(e){}   /* 上一次用存的那份沒有正常開起來 → 這次重抓 */
    if(fresh||bad||!window.indexedDB){try{localStorage.removeItem(BK)}catch(e){}return fetchApp(c)}
    dbGet('next').then(function(n){if(n&&n.html)return dbPut('cur',n).then(function(){return dbDel('next')}).then(function(){return n});return dbGet('cur')})
      .then(function(rec){if(rec&&rec.html&&rec.html.indexOf('<')>=0)boot(c,rec);else fetchApp(c)}).catch(function(){fetchApp(c)})}
  function wipe(){try{localStorage.removeItem(BK)}catch(e){}return Promise.all([dbDel('cur').catch(function(){}),dbDel('next').catch(function(){})])}
  $('save').onclick=function(){var raw=$('u').value.trim(),u=raw.replace(/[?#].*$/,''),k=$('k').value.trim(),m=/[?&]key=([^&#]+)/.exec(raw);
    if(!k&&m){try{k=decodeURIComponent(m[1])}catch(e){k=m[1]}$('k').value=k}   /* 貼的是原本那個帶 ?app=1&key=… 的網址:KEY 自動帶入 */
    if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u))return $('serr').textContent='網址要是 https://script.google.com/…/exec（不要帶 ? 後面的東西）';
    if(!k)return $('serr').textContent='請輸入 KEY';
    try{localStorage.setItem(K,JSON.stringify({url:u,key:k}))}catch(e){return $('serr').textContent='這個瀏覽器不能儲存設定（可能是私密瀏覽模式）'}wipe().then(function(){load(true)})};
  $('k').addEventListener('keydown',function(e){if(e.key==='Enter')$('save').click()});
  $('retry').onclick=function(){load(true)};$('reset').onclick=function(){setup('')};
  if(/reset/.test(location.hash)){try{history.replaceState(null,'',location.pathname)}catch(e){}wipe().then(function(){setup('')})}
  else if(/fresh/.test(location.hash)){try{history.replaceState(null,'',location.pathname)}catch(e){}load(true)}
  else load(false);
})();
</script>
</body>
</html>
